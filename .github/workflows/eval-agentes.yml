name: Conversas de referência (IA de verdade)

# Uma vez por dia (e à mão) roda as conversas de referência dos agentes contra o modelo de verdade no OpenRouter:
# confere se o time chama a ferramenta certa (gasto, lembrete, alarme, memória, mensagem só com o sim) e se a
# trava do "fiz" precisou corrigir. O resumo sai na página da execução. Custa centavos por rodada.
# Precisa do segredo OPENROUTER_API_KEY no repositório (Settings > Secrets and variables > Actions); sem ele, não roda.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-agentes
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planejai
          POSTGRES_PASSWORD: planejai
          POSTGRES_DB: planejai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planejai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://planejai:planejai@localhost:5432/planejai_test
      REDIS_URL: redis://localhost:6379
      EVAL_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Segredo do OpenRouter
        id: key
        run: |
          if [ -z "$EVAL_OPENROUTER_API_KEY" ]; then
            echo "Sem o segredo OPENROUTER_API_KEY: nada a rodar." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.key.outputs.ok == 'true'
      - run: npm run eval -w apps/server
        if: steps.key.outputs.ok == 'true'
