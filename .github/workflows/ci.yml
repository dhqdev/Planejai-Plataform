name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planejai
          POSTGRES_PASSWORD: planejai
          POSTGRES_DB: planejai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planejai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://planejai:planejai@localhost:5432/planejai_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ffmpeg (gravação do navegador) e o Chrome do runner para o teste do "computador" dos agentes
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: echo "CHROME_PATH=$(which google-chrome || which chromium)" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
