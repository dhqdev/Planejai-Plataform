name: CI

# Testa e, só se tudo passar, publica a imagem e avisa o Portainer.
# Antes o build da imagem rodava separado e subia para produção mesmo com teste vermelho.
on:
  push:
    branches: [main]
    tags: ["v*"]
    # só texto (skills, docs, README): não testa nem publica imagem (economiza minutos do Actions com o repo privado)
    paths-ignore: [".claude/**", "docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# push novo cancela o CI anterior do mesmo branch (assim uma imagem velha nunca sobrescreve a nova)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planejai
          POSTGRES_PASSWORD: planejai
          POSTGRES_DB: planejai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planejai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://planejai:planejai@localhost:5432/planejai_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ffmpeg (gravação do navegador) e o Chrome do runner para o teste do "computador" dos agentes
      # ffmpeg estático (binário pronto): o apt-get do runner às vezes trava 10+ min no mirror ou no man-db
      - uses: FedericoCarboni/setup-ffmpeg@v3
        timeout-minutes: 3
      - run: echo "CHROME_PATH=$(which google-chrome || which chromium)" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # cria a tag da versão a cada push na main
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Versão de cada push na main: a próxima patch depois da maior entre o package.json e a última tag
      # (v1.2.0 -> v1.2.1 -> v1.2.2...). O workflow Release continua para minor/major e para o CHANGELOG.
      # Na tag vX.Y.Z (Release) a versão é a da própria tag.
      - name: Versão
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            pkg=$(node -p "require('./package.json').version")
            last=$(git tag -l 'v*' --sort=-v:refname | head -1); last="${last#v}"
            base=$(printf '%s\n%s\n' "$pkg" "${last:-0.0.0}" | sort -V | tail -1)
            if [ "$base" = "$pkg" ] && ! git rev-parse -q --verify "refs/tags/v$pkg" >/dev/null; then
              v="$pkg"
            else
              IFS=. read -r a b c <<< "$base"; v="$a.$b.$((c + 1))"
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
          echo "Versão: $v"

      - name: Nome da imagem em minúsculas
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ steps.ver.outputs.minor }},enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
          # arm/v7 saiu: o browserless da stack não roda nele e era o build mais lento (QEMU)
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Opcional: redeploy automático no Portainer. Crie um webhook na stack/serviço
      # (Portainer > Stack > Webhook) e salve a URL no secret PORTAINER_WEBHOOK_URL.
      # Cada build ganha a tag sha-XXXXXXX e a da versão (X.Y.Z e X.Y; cada push na main é uma patch nova):
      # para voltar uma versão, troque :latest por uma delas na stack.
      - name: Redeploy no Portainer
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -n "$PORTAINER_WEBHOOK_URL" ]; then
            curl -fsS -X POST "$PORTAINER_WEBHOOK_URL" && echo "Portainer avisado"
          else
            echo "PORTAINER_WEBHOOK_URL não configurado; pulando"
          fi

      # imagem publicada: marca o commit com a tag da versão e abre a release com os commits desde a anterior
      # (push feito pelo GITHUB_TOKEN não dispara outro CI, então não constrói duas vezes)
      - name: Tag da versão
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then echo "v$V já existe"; exit 0; fi
          last=$(git tag -l 'v*' --sort=-v:refname | head -1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "Planejai v$V"
          git push origin "v$V"
          { [ -n "$last" ] && git log "$last..HEAD" --no-merges --pretty='- %s' | grep -v '^- release: ' || true; } > notes.md
          [ -s notes.md ] || echo "- Atualização" > notes.md
          gh release create "v$V" --title "Planejai v$V" --notes-file notes.md --verify-tag
