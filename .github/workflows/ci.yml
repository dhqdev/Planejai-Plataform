name: CI

# Testa e, só se tudo passar, publica a imagem e avisa o Portainer.
# Antes o build da imagem rodava separado e subia para produção mesmo com teste vermelho.
on:
  push:
    branches: [main]
    tags: ["v*"]
    # só texto (skills, docs, README): não testa nem publica imagem (economiza minutos do Actions com o repo privado)
    paths-ignore: [".claude/**", "docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# push novo cancela o CI anterior do mesmo branch (assim uma imagem velha nunca sobrescreve a nova)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planejai
          POSTGRES_PASSWORD: planejai
          POSTGRES_DB: planejai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planejai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://planejai:planejai@localhost:5432/planejai_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ffmpeg (gravação do navegador) e o Chrome do runner para o teste do "computador" dos agentes
      # ffmpeg estático (binário pronto, com libx264) de uma release fixa no GitHub, em cache.
      # O apt-get do runner às vezes trava 10+ min no mirror ou no man-db, e o setup-ffmpeg baixava
      # do johnvansickle.com, que fica lento e estourava o tempo. Se o GitHub falhar, cai no apt sem man-db.
      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: ~/.ffmpeg
          key: ffmpeg-static-b6.0-linux-x64
      - name: ffmpeg
        timeout-minutes: 5
        env:
          FFMPEG_URL: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-linux-x64.gz
          FFMPEG_SHA256: ed652b2f32e0851d1946894fb8333f5b677c1b2ce6b9d187910a67f8b99da028
        run: |
          mkdir -p ~/.ffmpeg
          if [ ! -x ~/.ffmpeg/ffmpeg ]; then
            if curl -fsSL --retry 3 --max-time 120 "$FFMPEG_URL" | gunzip > ~/.ffmpeg/ffmpeg \
              && echo "$FFMPEG_SHA256  $HOME/.ffmpeg/ffmpeg" | sha256sum -c -; then
              chmod +x ~/.ffmpeg/ffmpeg
            else
              rm -f ~/.ffmpeg/ffmpeg
              echo "download falhou; instalando pelo apt"
              sudo rm -f /var/lib/man-db/auto-update
              timeout 180 sudo apt-get update -qq
              timeout 180 sudo apt-get install -y -qq --no-install-recommends ffmpeg
            fi
          fi
          [ -x ~/.ffmpeg/ffmpeg ] && echo "$HOME/.ffmpeg" >> "$GITHUB_PATH"
          PATH="$HOME/.ffmpeg:$PATH" ffmpeg -hide_banner -version | head -1
      - run: echo "CHROME_PATH=$(which google-chrome || which chromium)" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # cria a tag da versão a cada push na main
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Versão de cada push na main: a próxima patch depois da maior entre o package.json e a última tag
      # (v1.2.0 -> v1.2.1 -> v1.2.2...). O workflow Release continua para minor/major e para o CHANGELOG.
      # Na tag vX.Y.Z (Release) a versão é a da própria tag.
      - name: Versão
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            pkg=$(node -p "require('./package.json').version")
            last=$(git tag -l 'v*' --sort=-v:refname | head -1); last="${last#v}"
            base=$(printf '%s\n%s\n' "$pkg" "${last:-0.0.0}" | sort -V | tail -1)
            if [ "$base" = "$pkg" ] && ! git rev-parse -q --verify "refs/tags/v$pkg" >/dev/null; then
              v="$pkg"
            else
              IFS=. read -r a b c <<< "$base"; v="$a.$b.$((c + 1))"
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
          echo "Versão: $v"

      # Mudanças publicadas (assunto de cada commit), lidas pelo blog para o post de novidades (blog.ts, updatesDue)
      - name: Novidades para o blog
        run: |
          git log -150 --no-merges --format='%H%x09%cI%x09%s' | node -e '
            const lines = require("fs").readFileSync(0, "utf8").split("\n").filter(Boolean);
            const list = lines.map((l) => { const [sha, date, ...s] = l.split("\t"); return { sha, date, subject: s.join("\t") }; });
            require("fs").writeFileSync("apps/server/novidades.json", JSON.stringify(list));
            console.log(list.length + " mudanças");'

      - name: Nome da imagem em minúsculas
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ steps.ver.outputs.minor }},enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
          # o build roda na arquitetura do runner ($BUILDPLATFORM); no QEMU só o "apk add ffmpeg", que fica no cache.
          # arm/v7 = Raspberry Pi 32 bits (sem o browserless, que só existe em amd64/arm64). Outras: install.sh compila.
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Redeploy automático no Portainer (CE serve): em Services, abra o serviço app e ligue "Service webhook";
      # repita no worker. Salve as URLs no secret PORTAINER_WEBHOOK_URL, uma por linha (ou separadas por espaço).
      # Cada serviço recebe a imagem da versão nova (?tag=X.Y.Z), assim o Swarm não fica com um "latest" velho em cache.
      # Cada build ganha a tag sha-XXXXXXX e a da versão (X.Y.Z e X.Y; cada push na main é uma patch nova):
      # para voltar uma versão, troque :latest por uma delas na stack.
      - name: Redeploy no Portainer
        # webhook com erro não pode impedir a tag e a release da versão já publicada
        continue-on-error: true
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          urls=$(printf '%s' "$PORTAINER_WEBHOOK_URL" | tr -s ' ,\r\n' '\n' | grep -v '^$' || true)
          if [ -z "$urls" ]; then echo "PORTAINER_WEBHOOK_URL não configurado; pulando"; exit 0; fi
          n=0; falhou=0
          while IFS= read -r url; do
            n=$((n + 1))
            sep='?'; case "$url" in *\?*) sep='&';; esac
            if curl -fsS -X POST --retry 3 --retry-all-errors --max-time 60 -o /dev/null "${url}${sep}tag=${V}"; then
              echo "serviço $n: Portainer avisado (versão $V)"
            else
              echo "::error::serviço $n: o Portainer não aceitou o webhook"; falhou=1
            fi
          done <<< "$urls"
          exit $falhou

      # imagem publicada: marca o commit com a tag da versão e abre a release com os commits desde a anterior
      # (push feito pelo GITHUB_TOKEN não dispara outro CI, então não constrói duas vezes)
      - name: Tag da versão
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then echo "v$V já existe"; exit 0; fi
          last=$(git tag -l 'v*' --sort=-v:refname | head -1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "Planejai v$V"
          git push origin "v$V"
          { [ -n "$last" ] && git log "$last..HEAD" --no-merges --pretty='- %s' | grep -v '^- release: ' || true; } > notes.md
          [ -s notes.md ] || echo "- Atualização" > notes.md
          gh release create "v$V" --title "Planejai v$V" --notes-file notes.md --verify-tag
