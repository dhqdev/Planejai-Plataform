; Ninguém disca para fora pela central: as ligações só saem quando o voz.py pede pela ARI (só dentro do contêiner).
[general]
static=yes
writeprotect=yes

; o que vier do gateway (alguém ligando para o chip, ou um aparelho tentando usar a central) é desligado
[entrada-gsm]
exten => _X.,1,Hangup(21)
exten => s,1,Hangup(21)
exten => _+X.,1,Hangup(21)

; a pessoa atendeu: fala o lembrete duas vezes, com pausa, e desliga
[planejai-ligacao]
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Playback(${PJ_AUDIO})
 same => n,Wait(1)
 same => n,Playback(${PJ_AUDIO})
 same => n,Wait(1)
 same => n,Hangup()
