; Gerado pelo entrypoint a partir das variáveis VOZ_*. Só um aparelho entra: o gateway GSM (usuário "gsm").
[global]
type=global
user_agent=Planejai

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:${VOZ_SIP_PORTA}
${VOZ_NAT}

[gsm]
type=endpoint
; o que chega do gateway (ligação recebida, tentativa de discar) cai num contexto que só desliga
context=entrada-gsm
disallow=all
allow=alaw,ulaw
auth=gsm
aors=gsm
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
from_user=gsm

[gsm]
type=auth
auth_type=userpass
username=gsm
password=${VOZ_SENHA_GATEWAY}

[gsm]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30
