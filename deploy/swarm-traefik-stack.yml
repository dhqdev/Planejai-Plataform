# Stack do Planejai para Portainer em Docker Swarm com Traefik (rede externa network_public),
# no mesmo padrão do n8n. Postgres e Redis PRÓPRIOS (serviços "db", "redis" e "redis-cache"), sem usar os que já existem.
# Troque os valores marcados com TROQUE antes de subir. Gere segredos com: openssl rand -hex 32
version: "3.7"

x-env: &env
  # --- Banco próprio da stack ---
  DATABASE_URL: postgres://planejai:TROQUE_SENHA_DO_BANCO@db:5432/planejai
  # --- Endereço público ---
  PUBLIC_URL: https://autoplanejai.tekvosoft.com
  TZ: America/Sao_Paulo
  DEFAULT_TIMEZONE: America/Sao_Paulo
  # --- Segurança: um segredo para cada coisa ---
  SESSION_SECRET: TROQUE_SESSION_SECRET_64_CARACTERES     # login do painel (trocar = todo mundo entra de novo)
  ENCRYPTION_KEY: TROQUE_ENCRYPTION_KEY_64_CARACTERES     # credenciais das integrações (para trocar, mova a atual para ENCRYPTION_KEY_OLD)
  INTERNAL_API_KEY: TROQUE_INTERNAL_API_KEY               # API interna do n8n (vazia = desligada)
  # APP_SECRET: só se você já tinha um. Ele abre as credenciais antigas e, no boot, elas são recriptografadas com a ENCRYPTION_KEY.
  ADMIN_EMAIL: TROQUE_SEU_EMAIL
  ADMIN_PASSWORD: TROQUE_SENHA_DO_PAINEL
  WEBHOOK_SECRET: TROQUE_WEBHOOK_SECRET
  # --- IA ---
  OPENROUTER_API_KEY: TROQUE_CHAVE_OPENROUTER
  # --- WhatsApp: conexão própria por QR code (tela WhatsApp do painel) ---
  WHATSAPP_PROVIDER: baileys
  OWNER_PHONES: "5519995378302"
  ALLOW_UNKNOWN_CONTACTS: "false"
  INVITES_PER_DAY: "40"
  # --- n8n na mesma rede (network_public): liga sozinho, sem tela de Integrações ---
  # n8n-interno é o apelido do n8n na rede (veja deploy/n8n-stack.yml). Eventos vão para /webhook/planejai-eventos.
  N8N_URL: http://n8n-interno:5678
  # Para o assistente listar e CRIAR fluxos: no n8n, Settings > n8n API > Create an API key, e cole aqui.
  N8N_API_KEY: ""
  # Busca web do Pesquisador (Tavily, plano grátis 1.000 buscas/mês). Sem ela usa a busca paga do OpenRouter.
  TAVILY_API_KEY: ""
  # Lugares perto com telefone (Google Places API New). Sem ela usa o OpenStreetMap, grátis.
  GOOGLE_MAPS_API_KEY: ""
  # Arquivos (documentos e mídias) num bucket S3/R2 em vez do Postgres. Vazio = ficam no banco (docs/operacao.md)
  STORAGE_S3_ENDPOINT: ""
  STORAGE_S3_BUCKET: ""
  STORAGE_S3_REGION: "auto"
  STORAGE_S3_ACCESS_KEY_ID: ""
  STORAGE_S3_SECRET_ACCESS_KEY: ""
  # Automações que cada cliente pode ter (criadas pelo assistente no n8n)
  AUTOMATIONS_PER_USER: "5"
  # --- Login no painel: navegador novo recebe código de 6 dígitos no WhatsApp (OWNER_PHONES para o dono) ---
  LOGIN_CODE: "true"
  # --- Redis próprios: memória curta das conversas (24h) e cache descartável ---
  REDIS_URL: redis://redis:6379
  REDIS_CACHE_URL: redis://redis-cache:6379
  MESSAGE_RETENTION_HOURS: "24"
  # texto das conversas nos logs some depois disso; ficam só custo, tempo e modelo
  LOG_CONTENT_HOURS: "24"
  WORKER_CONCURRENCY: "4"
  # --- Navegador dos agentes (prints e pesquisa gravada em vídeo) ---
  BROWSERLESS_URL: http://browserless:3000
  BROWSERLESS_TOKEN: TROQUE_BROWSERLESS_TOKEN
  LOG_LEVEL: info

services:
  app:
    # Cada build ganha a tag sha-XXXXXXX: para voltar uma versão, troque "latest" por ela e atualize a stack.
    image: ghcr.io/dhqdev/planejai-plataform:latest
    environment:
      <<: *env
      ROLE: api
      PORT: "3000"
    networks:
      # o n8n chama a API interna por http://planejai-app:3000 (sem sair para a internet)
      network_public:
        aliases:
          - planejai-app
      planejai_internal: {}
      planejai_browser: {}
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.autoplanejai.rule=Host(`autoplanejai.tekvosoft.com`)"
        - "traefik.http.routers.autoplanejai.entrypoints=websecure"
        - "traefik.http.routers.autoplanejai.service=autoplanejai-service"
        - "traefik.http.routers.autoplanejai.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.autoplanejai-service.loadbalancer.server.port=3000"

  # Time de agentes, lembretes e a conexão do WhatsApp. Sempre 1 réplica.
  # O healthcheck da imagem confere se o processo e a conexão do WhatsApp não travaram (o Swarm reinicia se travar).
  worker:
    image: ghcr.io/dhqdev/planejai-plataform:latest
    environment:
      <<: *env
      ROLE: worker
    networks:
      # para falar com o n8n pela rede interna (sem labels do Traefik: não fica exposto)
      - network_public
      - planejai_internal
      - planejai_browser
    deploy:
      mode: replicated
      replicas: 1
      # para o antigo antes de subir o novo: só pode existir uma conexão do WhatsApp
      update_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: planejai
      POSTGRES_USER: planejai
      POSTGRES_PASSWORD: TROQUE_SENHA_DO_BANCO
      TZ: America/Sao_Paulo
    volumes:
      - planejai_db:/var/lib/postgresql/data
    networks:
      - planejai_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planejai -d planejai"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  # Backup diário do banco (pg_dump), guardado 14 dias no volume planejai_backups.
  # Para mandar uma cópia para fora do servidor (recomendado), configure um remoto do rclone, ex. Cloudflare R2:
  #   BACKUP_REMOTE: r2:planejai-backups
  #   RCLONE_CONFIG_R2_TYPE: s3
  #   RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  #   RCLONE_CONFIG_R2_ACCESS_KEY_ID: ...
  #   RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ...
  #   RCLONE_CONFIG_R2_ENDPOINT: https://<conta>.r2.cloudflarestorage.com
  # Restaurar: veja docs/operacao.md.
  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: planejai
      PGPASSWORD: TROQUE_SENHA_DO_BANCO
      PGDATABASE: planejai
      TZ: America/Sao_Paulo
      BACKUP_KEEP_DAYS: "14"
      BACKUP_REMOTE: ""
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$BACKUP_REMOTE" ]; then apk add --no-cache rclone >/dev/null 2>&1 || echo "rclone não instalou: backup só local"; fi
        sleep 60
        while true; do
          f="/backups/planejai-$$(date +%Y%m%d-%H%M).dump"
          if pg_dump -Fc -f "$$f.tmp"; then
            mv "$$f.tmp" "$$f"; echo "backup ok: $$f ($$(du -h "$$f" | cut -f1))"
            if [ -n "$$BACKUP_REMOTE" ] && command -v rclone >/dev/null; then
              rclone copy "$$f" "$$BACKUP_REMOTE" && echo "copiado para $$BACKUP_REMOTE"
              rclone delete --min-age "$${BACKUP_KEEP_DAYS}d" "$$BACKUP_REMOTE" >/dev/null 2>&1
            fi
          else
            rm -f "$$f.tmp"; echo "BACKUP FALHOU"
          fi
          find /backups -name 'planejai-*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep 86400
        done
    volumes:
      - planejai_backups:/backups
    networks:
      - planejai_internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  # Memória curta das conversas: não pode perder nada, então grava em disco e nunca despeja chave.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - planejai_redis:/data
    networks:
      - planejai_internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 320M
      restart_policy:
        condition: any

  # Cache descartável (buscas, páginas, mídia interpretada): sem disco, quando enche apaga o mais antigo.
  redis-cache:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - planejai_internal
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 160M
      restart_policy:
        condition: any

  # Navegador dos agentes numa rede só dele (com app e worker): abre páginas da internet, mas não enxerga db nem redis.
  browserless:
    image: ghcr.io/browserless/chromium:v2.57.0
    environment:
      TOKEN: TROQUE_BROWSERLESS_TOKEN
      CONCURRENT: "2"
      TIMEOUT: "300000"
    networks:
      - planejai_browser
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 1536M
      restart_policy:
        condition: any

volumes:
  planejai_db:
    name: planejai_db
  planejai_redis:
    name: planejai_redis
  planejai_backups:
    name: planejai_backups

networks:
  network_public:
    external: true
    name: network_public
  planejai_internal:
    driver: overlay
    attachable: true
  planejai_browser:
    driver: overlay
