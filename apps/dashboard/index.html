<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Planejai" />
    <meta name="format-detection" content="telephone=no" />
    <title>Planejai</title>
  </head>
  <body>
    <div id="root"><div class="pj-boot" role="status" aria-label="Carregando"><div class="pj-loader"><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div></div></div></div>
    <script>
      /* Se o app não abrir (versão nova pela metade, cache velho), mostra um botão que limpa tudo e recarrega. */
      (function () {
        var shown = false;
        function rescue() {
          var root = document.getElementById("root");
          if (shown || (root && root.children.length && !root.querySelector(".pj-boot"))) return;
          shown = true;
          var b = document.createElement("div");
          b.className = "pj-rescue";
          b.innerHTML = '<p>O Planejai não carregou.</p><button type="button">Recarregar</button>';
          b.querySelector("button").onclick = function () {
            var jobs = [];
            try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
            try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
            Promise.all(jobs).catch(function () {}).then(function () { location.replace(location.pathname + "?v=" + Date.now()); });
          };
          document.body.appendChild(b);
        }
        window.addEventListener("error", function (e) { if (e.target && e.target.tagName === "SCRIPT") setTimeout(rescue, 1500); }, true);
        setTimeout(rescue, 9000);
      })();
    </script>
    <style>
      /* blocos em onda enquanto o app baixa (o React troca isso pela tela) */
      .pj-boot { position: fixed; inset: 0; display: grid; place-content: center; background: #fafaf9; }
      .pj-boot .pj-loader { width: 80px; height: 100px; }
      .pj-boot .block { position: relative; float: left; margin: 0 10px 10px 0; width: 12px; height: 12px; border-radius: 3px; background: #18181b; }
      .pj-boot .block:nth-child(4n+1) { animation: pj-boot-wave 2s ease 0s infinite; }
      .pj-boot .block:nth-child(4n+2) { animation: pj-boot-wave 2s ease .2s infinite; }
      .pj-boot .block:nth-child(4n+3) { animation: pj-boot-wave 2s ease .4s infinite; }
      .pj-boot .block:nth-child(4n+4) { animation: pj-boot-wave 2s ease .6s infinite; margin-right: 0; }
      @keyframes pj-boot-wave { 0% { top: 0; opacity: 1; } 50% { top: 30px; opacity: .2; } 100% { top: 0; opacity: 1; } }
      @media (prefers-color-scheme: dark) { .pj-boot { background: #0a0a0b; } .pj-boot .block { background: #fff; } }
      :root[data-theme="dark"] .pj-boot { background: #0a0a0b; } :root[data-theme="dark"] .pj-boot .block { background: #fff; }
      :root[data-theme="light"] .pj-boot { background: #fafaf9; } :root[data-theme="light"] .pj-boot .block { background: #18181b; }
      .pj-rescue { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center; font: 15px/1.4 system-ui, sans-serif; color: #5f5f68; background: #fafaf9; z-index: 9999; }
      .pj-rescue p { margin: 0; }
      .pj-rescue button { justify-self: center; border: 0; border-radius: 8px; padding: 11px 22px; font: 500 15px system-ui, sans-serif; background: #18181b; color: #fff; cursor: pointer; }
      @media (prefers-color-scheme: dark) { .pj-rescue { background: #0a0a0b; color: #a1a1aa; } .pj-rescue button { background: #f4f4f5; color: #0a0a0b; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
