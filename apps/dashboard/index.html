<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/icons/logo-256.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <meta name="theme-color" content="#ffffff" />
    <script>
      /* Quem está logado: pergunta já, enquanto o JS do app baixa (o App.tsx usa esta resposta em vez de pedir de novo). */
      try {
        window.__pjMe = fetch("/api/auth/me", { credentials: "include" }).then(function (r) { return r.ok ? r.json() : r.status === 401 ? null : undefined; }, function () { return undefined; });
      } catch (e) {}
    </script>
    <script>
      /* Barra de cima do celular (status bar do iPhone no app instalado) na cor do tema escolhido no painel, não do sistema. */
      try {
        var t = localStorage.getItem("pj-theme");
        if (t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) document.querySelector('meta[name="theme-color"]').content = "#191919";
      } catch (e) {}
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Planejai" />
    <meta name="format-detection" content="telephone=no" />
    <title>Planejai</title>
  </head>
  <body>
    <div id="root"><div class="pj-boot" role="status" aria-label="Carregando"><img class="pj-logo" src="/icons/logo-256.png" width="112" height="112" alt="" /></div></div>
    <script>
      /* Se o app não abrir (versão nova pela metade, cache velho), mostra um botão que limpa tudo e recarrega. */
      (function () {
        var shown = false;
        function rescue() {
          var root = document.getElementById("root");
          if (shown || (root && root.children.length && !root.querySelector(".pj-boot"))) return;
          shown = true;
          var b = document.createElement("div");
          b.className = "pj-rescue";
          b.innerHTML = '<p>O Planejai não carregou.</p><button type="button">Recarregar</button>';
          b.querySelector("button").onclick = function () {
            var jobs = [];
            try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
            try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
            Promise.all(jobs).catch(function () {}).then(function () { location.replace(location.pathname + "?v=" + Date.now()); });
          };
          document.body.appendChild(b);
        }
        window.addEventListener("error", function (e) { if (e.target && e.target.tagName === "SCRIPT") setTimeout(rescue, 1500); }, true);
        setTimeout(rescue, 9000);
      })();
    </script>
    <style>
      /* abertura: o Bolinho no meio, na mesma cor da tela de abertura do Android (manifest), sem piscar; o React troca isso pela tela */
      .pj-boot { position: fixed; inset: 0; display: grid; place-content: center; background: #f5f3fe; }
      .pj-boot .pj-logo { width: 112px; height: 112px; border-radius: 26px; animation: pj-boot-in .45s cubic-bezier(.2, .8, .2, 1) both, pj-boot-breathe 2.4s ease-in-out .45s infinite; }
      @keyframes pj-boot-in { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: scale(1); } }
      @keyframes pj-boot-breathe { 50% { transform: scale(1.04); } }
      @media (prefers-reduced-motion: reduce) { .pj-boot .pj-logo { animation: none; } }
      @media (prefers-color-scheme: dark) { .pj-boot { background: #111; } }
      :root[data-theme="dark"] .pj-boot { background: #111; }
      :root[data-theme="light"] .pj-boot { background: #f5f3fe; }
      .pj-rescue { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center; font: 15px/1.4 Inter, system-ui, sans-serif; color: #74746f; background: #fafafa; z-index: 9999; }
      .pj-rescue p { margin: 0; }
      .pj-rescue button { justify-self: center; border: 0; border-radius: 999px; padding: 12px 26px; font: 600 15px Inter, system-ui, sans-serif; background: #141414; color: #fff; cursor: pointer; }
      @media (prefers-color-scheme: dark) { .pj-rescue { background: #111; color: #9a9a94; } .pj-rescue button { background: #f1f1ee; color: #111; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
